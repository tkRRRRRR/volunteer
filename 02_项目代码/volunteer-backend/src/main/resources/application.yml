server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: volunteer-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/gaokao_volunteer?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  cache:
    type: simple

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-before-production-2026}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
